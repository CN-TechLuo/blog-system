version: "3.8"

# 生产环境编排示例：MySQL 8 + 后端 + Nginx（含前端静态资源）
# 使用前：
#   1. 前端执行 npm run build 生成 dist/
#   2. 复制 .env.example 为 .env 并填写全部密钥
#   3. docker compose -f docker-compose.prod.yml up -d

services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: blog_db
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [blog-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: blog-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/blog_db?useSSL=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://blog.example.com}
      RESET_PASSWORD_URL: ${RESET_PASSWORD_URL:-https://blog.example.com/reset-password}
      ADMIN_BOOTSTRAP_ENABLED: "false"
      TZ: Asia/Shanghai
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    volumes:
      - uploads-data:/app/uploads
      - logs-data:/app/logs
    networks: [blog-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: blog-nginx
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks: [blog-net]

volumes:
  mysql-data:
  uploads-data:
  logs-data:

networks:
  blog-net:
