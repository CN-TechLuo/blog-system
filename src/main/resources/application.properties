# ============================================================
# 数据库连接配置
# ============================================================
# 本地开发使用 useSSL=false，生产环境建议启用 SSL
spring.datasource.url=jdbc:mysql://localhost:3306/blog_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
# 通过环境变量设置数据库凭据: -DDB_USERNAME=root -DDB_PASSWORD=yourpassword
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD}



# ============================================================
# MyBatis 配置
# ============================================================
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.blog.blogsystme.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ============================================================
# 日志配置
# ============================================================
logging.level.com.blog.blogsystme=debug

# ============================================================
# Actuator 健康检查（生产环境建议限制暴露端点）
# ============================================================
management.endpoints.web.exposure.include=health,info
# 未引入 spring-boot-starter-security，无法认证，设为 never 避免配置歧义
management.endpoint.health.show-details=never

# ============================================================
# 服务器端口
# ============================================================
server.port=8080

# ============================================================
# JWT 密钥（通过环境变量注入，不要在配置文件中明文写密钥）
# 启动时设置: -Djwt.secret=YourBase64EncodedSecret  或 环境变量 JWT_SECRET
# 生成命令: openssl rand -base64 32
# 下面提供一个开发环境默认值，生产环境务必通过环境变量覆盖
# ============================================================
jwt.secret=${JWT_SECRET:REDACTED_DEV_SECRET_SET_ENV_VARIABLE}

