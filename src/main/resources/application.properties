# ============================================================
# 数据库连接配置
# ============================================================
# 生产环境通过环境变量注入真实值，此处为默认值（开发/兜底）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blog_db?useSSL=true&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# ============================================================
# HikariCP 连接池配置
# ============================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=10000

# ============================================================
# MyBatis 配置
# ============================================================
mybatis.type-aliases-package=com.blog.blogsystme.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ============================================================
# 日志配置（生产环境使用 INFO 级别）
# ============================================================
logging.level.com.blog.blogsystme=info
logging.level.com.blog.blogsystme.mapper=warn

# ============================================================
# Actuator 健康检查（生产环境通过反向代理限制外网访问）
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ============================================================
# 服务器配置
# ============================================================
server.port=${SERVER_PORT:8080}

# 优雅停机
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# HTTP GZIP 压缩
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ============================================================
# JWT 密钥（必须通过环境变量注入，不提供默认值）
# 生产环境生成命令: openssl rand -base64 32
# Windows PowerShell: [Convert]::ToBase64String((1..32|%{Get-Random -Maximum 256}))
# ============================================================
jwt.secret=${JWT_SECRET:}

# ============================================================
# CORS 允许的前端源（生产环境通过环境变量 CORS_ORIGINS 注入）
# ============================================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
