# ============================================================
# 数据库连接配置
# ============================================================
# 生产环境默认启用 SSL；本地开发通过系统环境变量 SPRING_DATASOURCE_URL 覆盖
# Windows 设置方法：Win+R → sysdm.cpl → 高级 → 环境变量 → 新建
#   SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/blog_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blog_db?useSSL=true&serverTimezone=Asia/Shanghai}
# ============================================================
# 🔴 必填环境变量（通过 Windows 系统环境变量设置，不落盘、不进 Git）
#   DB_USERNAME=root
#   DB_PASSWORD=你的MySQL密码
#   JWT_SECRET=Base64编码的密钥
#  JWT_SECRET 生成命令（PowerShell）：
#   [Convert]::ToBase64String((1..32|%{Get-Random -Maximum 256}))
# ============================================================
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}



# ============================================================
# MyBatis 配置
# ============================================================
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.blog.blogsystme.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ============================================================
# 日志配置
# ============================================================
logging.level.com.blog.blogsystme=debug

# ============================================================
# Actuator 健康检查（生产环境建议限制暴露端点）
# ============================================================
management.endpoints.web.exposure.include=health,info
# 未引入 spring-boot-starter-security，无法认证，设为 never 避免配置歧义
management.endpoint.health.show-details=never

# ============================================================
# 服务器端口
# ============================================================
server.port=8080

# ============================================================
# JWT 密钥（必须通过环境变量注入，不提供默认值）
# 启动时设置: -Djwt.secret=YourBase64EncodedSecret  或 环境变量 JWT_SECRET
# 生成命令: openssl rand -base64 32
# 注意: JwtUtil 直接读取 System.getProperty / System.getenv，
#       不依赖 Spring 的属性注入；此处占位符仅用于文档目的。
#       若未配置，JwtUtil 会在类加载时抛出 IllegalStateException。
# ============================================================
jwt.secret=${JWT_SECRET:}

