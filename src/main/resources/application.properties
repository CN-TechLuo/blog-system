# 数据库连接配置（告诉Spring连哪个数据库）
spring.datasource.url=jdbc:mysql://localhost:3306/blog_db?useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=你的数据库密码

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.blog.blogsystem.entity

 # 驼峰映射
mybatis.configuration.map-underscore-to-camel-case=true

#/
# /

# 日志配置
logging.level.com.blog.blog_system=debug



