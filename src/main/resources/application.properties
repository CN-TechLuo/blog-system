# ============================================================
# 数据库连接配置
# ============================================================
# 生产环境通过环境变量注入真实值，此处为默认值（开发/兜底）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blog_db?useSSL=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ============================================================
# HikariCP 连接池配置
# ============================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=10000

# ============================================================
# MyBatis 配置
# ============================================================
mybatis.type-aliases-package=com.blog.blogsystem.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ============================================================
# 日志配置（生产环境使用 INFO 级别）
# ============================================================
logging.level.com.blog.blogsystem=info
logging.level.com.blog.blogsystem.mapper=warn

# ============================================================
# Actuator 健康检查（生产环境通过反向代理限制外网访问）
# ============================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
# Redis 健康指标关闭：限流存储默认内存模式（本地无 Redis 时健康检查不误报 DOWN）；
# Redis 可用性由 docker-compose 容器 healthcheck + 告警规则监控
management.health.redis.enabled=false

# ============================================================
# 服务器配置
# ============================================================
server.port=${SERVER_PORT:8080}

# 优雅停机
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# HTTP GZIP 压缩
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ============================================================
# 虚拟线程（Spring Boot 3.2+ 内置支持，Tomcat 使用虚拟线程处理请求）
# ============================================================
spring.threads.virtual.enabled=true

# ============================================================
# OpenAPI / Swagger
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ============================================================
# JWT 密钥（必须通过环境变量注入，不提供默认值）
# 生产环境生成命令: openssl rand -base64 32
# Windows PowerShell: [Convert]::ToBase64String((1..32|%{Get-Random -Maximum 256}))
# ============================================================
jwt.secret=${JWT_SECRET}

# ============================================================
# CORS 允许的前端源（生产环境通过环境变量 CORS_ORIGINS 注入）
# ============================================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ============================================================
# 文件上传配置（当前上传走 Base64 JSON 体，multipart 仅保留最小限额）
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.location=${java.io.tmpdir}
server.tomcat.connection-timeout=60000

# ============================================================
# 邮件配置（找回密码功能，可选）
# 未配置 spring.mail.host 时重置令牌通过 API 响应返回（仅限开发环境）
# 生产环境必须配置 SMTP:
# spring.mail.host=smtp.example.com
# spring.mail.port=465
# spring.mail.username=your@example.com
# spring.mail.password=your-smtp-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.ssl.enable=true
# app.reset-password-url=https://你的前端域名/reset-password
# ============================================================
app.reset-password-url=${RESET_PASSWORD_URL:http://localhost:5173/reset-password}

# ============================================================
# 安全加固（16 级安全体系，详见 SECURITY.md）
# ============================================================
# 反向代理（Nginx/Traefik）信任转发头，保证限流取到真实客户端 IP
server.forward-headers-strategy=framework
# 错误响应不向客户端泄露异常信息/堆栈
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
# 会话痕迹：无状态 JWT，禁用 URL 重写
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# ============================================================
# Flyway 数据库迁移（V1=完整初始化，V2+=增量；存量库自动 baseline 跳过 V1）
# ============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ============================================================
# AI 配额与审计日志（企业级成本/安全管控）
# ============================================================
app.ai.daily-limit=${AI_DAILY_LIMIT:100}
app.audit-log-path=${AUDIT_LOG_PATH:logs/audit.log}

# ============================================================
# 限流存储（上线整改）：memory=单机内存（默认）；redis=多实例共享
# 多副本部署必须设置 RATE_LIMIT_STORE=redis（docker-compose 已内置 redis）
# ============================================================
app.rate-limit.store=${RATE_LIMIT_STORE:memory}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# 未启用 Redis 时关闭健康检查（默认内存限流模式下无需连接 Redis）
management.health.redis.enabled=${MANAGEMENT_HEALTH_REDIS:false}

# ============================================================
# 图形验证码（上线整改）：注册/登录前置校验，缓解撞库与批量注册
# CAPTCHA_ENABLED=false 可关闭（仅限开发/内网环境）
# ============================================================
app.captcha.enabled=${CAPTCHA_ENABLED:true}
