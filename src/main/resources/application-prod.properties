# ============================================================
# 生产环境配置（spring.profiles.active=prod 时加载）
# 部署时通过环境变量覆盖敏感值，此文件仅作为文档参考
# ============================================================

# 数据库 — 必须通过环境变量注入
# SPRING_DATASOURCE_URL=jdbc:mysql://your-host:3306/blog_db?useSSL=true&serverTimezone=Asia/Shanghai
# DB_USERNAME=your_db_username
# DB_PASSWORD=your_db_password

# 日志级别
logging.level.com.blog.blogsystme=warn
logging.level.com.blog.blogsystme.mapper=error

# 前端域名（逗号分隔多个域名）
# CORS_ORIGINS=https://your-domain.com

# Actuator 不暴露详情
management.endpoint.health.show-details=never

# 生产环境关闭 Swagger UI 和 API 文档
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 服务器端口
# SERVER_PORT=8080
