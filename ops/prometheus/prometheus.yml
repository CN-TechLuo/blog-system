# Prometheus 配置（生产部署：docker compose -f docker-compose.prod.yml up -d）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "blog-backend"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "jvm_.*"
        action: keep
      - source_labels: [__name__]
        regex: "http_server_requests_.*|process_.*|system_.*|hikaricp_.*|cache_.*|logback_events_total"
        action: keep

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
