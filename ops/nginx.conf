# HTTPS + WAF 基础配置（生产 Nginx 模板）
# 放置到 /etc/nginx/conf.d/default.conf（docker-compose 已挂载）

# 限流区：单 IP 10r/s，突发 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# 隐藏 Nginx 版本号
server_tokens off;

server {
    listen 80;
    server_name blog.example.com;
    # 强制 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name blog.example.com;

    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # SPA 的 CSP；API/上传路径同时还会带上后端更严格的 CSP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https:; font-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    client_max_body_size 6m;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        # 只用 expires，避免 location 级 add_header 覆盖 server 级安全头
        expires 30d;
    }

    # 上传目录（图片）
    location /uploads/ {
        proxy_pass http://backend:8080;
        expires 7d;
    }

    # API（限流）
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # 必须覆盖客户端自带的 X-Forwarded-For，不能使用 $proxy_add_x_forwarded_for
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 若 Nginx 前还有一层负载均衡，取消下面注释，并只信任 LB 的网段：
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;
    # 启用后 $remote_addr 即为 LB 还原后的客户端 IP，上面的覆盖逻辑仍然成立。

    # 健康检查与指标：仅内网可达
    location /actuator/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8080;
    }

    # OpenAPI/Swagger 文档限制内网（prod 已关闭，此处为纵深防御）
    location ~ ^/(api-docs|v3/api-docs|swagger-ui) {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8080;
    }
}
