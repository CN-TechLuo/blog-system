name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          # CI 一次性数据库口令：不是密钥材料，仓库 Secret 存在时优先使用
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-throwaway-db-pw' }}
          MYSQL_DATABASE: blog_db
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h localhost" --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Generate ephemeral CI JWT secret
        # 每次运行随机生成，仓库里不再存在任何可签名的 JWT 密钥
        run: echo "CI_JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -u root -p${{ secrets.CI_DB_PASSWORD || 'ci-throwaway-db-pw' }} -e "SELECT 1" > /dev/null 2>&1; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
      - name: Build and test with Maven (Flyway auto-migrates schema)
        run: ./mvnw verify
        env:
          DB_USERNAME: root
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-throwaway-db-pw' }}
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/blog_db?useSSL=true&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=UTF-8

  docker:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: blog-system:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push image to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
